# API CI — runs on every pull request to main and every push to main or develop.
# Same commands as `npm run check` locally, so local and CI results match.
# NOTE: the job name below is a required status check in the `protect-main` ruleset.
#       Renaming it means updating the ruleset too.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]
  workflow_dispatch:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# A new push to the same PR cancels the older, now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  backend:
    name: Backend - lint, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Throw-away PostgreSQL 16 (same major version as local, D-17) for integration tests.
    # Test-only credentials; this database exists only for the length of the job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: appointments_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d appointments_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (exact versions from lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests with coverage
        run: npm run test:coverage

      # Local installs here run PostgreSQL in India time; make CI do the same so time zone
      # bugs (like D-28) fail in CI instead of hiding behind a UTC server.
      - name: Run the test database in India time
        run: >-
          psql "postgresql://app_user:ci_test_password@localhost:5432/appointments_test"
          -c "ALTER DATABASE appointments_test SET TimeZone TO 'Asia/Kolkata'"

      - name: Integration tests (real PostgreSQL)
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://app_user:ci_test_password@localhost:5432/appointments_test

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$file"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $file\$" | sha256sum -c -
          tar -xzf "$file" gitleaks

      - name: Scan every commit for secrets
        run: ./gitleaks git . --redact --verbose --exit-code 1

  # The whole app end to end: this API + the Angular app (public web repo) + PostgreSQL,
  # so an API change that breaks a screen fails here too.
  e2e:
    name: E2E - Playwright (web app + this API)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: appointments_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d appointments_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: 'true'
      API_DIR: .. # the web checkout lives in ./web, this API in the job's root folder
      DATABASE_URL: postgresql://app_user:ci_test_password@localhost:5432/appointments_e2e
      # Test-only values for this throw-away environment.
      JWT_SECRET: ci-e2e-only-secret-not-used-anywhere-else-0123456789
      JWT_EXPIRES_IN: 1h
      SEED_PASSWORD: Password123

    steps:
      - name: Checkout API
        uses: actions/checkout@v5

      # The web branch that matches this API branch: main for main / PRs to main, else develop.
      - name: Checkout web
        uses: actions/checkout@v5
        with:
          repository: anil-ofc-1999/appointment_web
          ref: ${{ (github.base_ref || github.ref_name) == 'main' && 'main' || 'develop' }}
          path: web

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install API dependencies, create tables and seed test data
        run: |
          npm ci
          npx prisma migrate deploy
          npm run db:seed

      - name: Install web dependencies and Playwright browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests (desktop + mobile)
        working-directory: web
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
