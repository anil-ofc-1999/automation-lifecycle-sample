# Backend CI — runs on every pull request to main and every push to main.
# Same commands as `npm run check` locally, so local and CI results match.
name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# A new push to the same PR cancels the older, now-outdated run.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: appointment_node_API

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: appointment_node_API/package-lock.json

      - name: Install dependencies (exact versions from lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: appointment_node_API/coverage/
          retention-days: 7
          if-no-files-found: ignore
